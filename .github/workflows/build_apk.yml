name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android_app/gradlew

      - name: Build Debug APK
        run: |
          cd android_app
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android_app/app/build/outputs/apk/debug/app-debug.apk ./posnetes_rollito.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: posnetes_rollito_apk
          path: ./posnetes_rollito.apk

      - name: Release APK
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v0.2.0-apk
          name: "POSNETES Rollito APK (Android 6+)"
          files: ./posnetes_rollito.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
