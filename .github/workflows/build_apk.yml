name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'

      - name: Build Debug APK
        run: |
          cd android_app
          gradle assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android_app/app/build/outputs/apk/debug/app-debug.apk ./posnetes_rollito.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: posnetes_rollito_apk
          path: ./posnetes_rollito.apk
          if-no-files-found: error

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v0.2.0-apk
          name: "POSNETES Rollito APK (Android 6+)"
          files: ./posnetes_rollito.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
