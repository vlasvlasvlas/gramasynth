name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 7.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'

      - name: Build Debug APK
        run: |
          cd android_app
          gradle assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Copy APK
        run: cp android_app/app/build/outputs/apk/debug/app-debug.apk ./posnetes_rollito.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: posnetes_rollito_apk
          path: ./posnetes_rollito.apk
          if-no-files-found: error

      - name: Delete existing release if present
        run: gh release delete "latest-apk" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "POSNETES Rollito APK (Android 6+)"
          body: "APK debug generado automáticamente desde el último commit en main."
          files: ./posnetes_rollito.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
