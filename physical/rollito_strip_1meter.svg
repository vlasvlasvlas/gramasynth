<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 70" width="1020mm" height="70mm">
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #000000; stroke-width: 0.5; }
      .cut-line { stroke: #999999; stroke-dasharray: 2,2; stroke-width: 0.3; }
      .marker { fill: #000000; }
      .block-border { fill: none; stroke: #000000; stroke-width: 0.8; }
      .band-divider { stroke: #000000; stroke-width: 0.6; stroke-dasharray: 1,1; }
      .grid-line { stroke: #dddddd; stroke-width: 0.25; }
      .grid-beat { stroke: #aaaaaa; stroke-width: 0.4; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 2.2px; fill: #555555; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 2.8px; font-weight: bold; fill: #000000; }
      .note-on { fill: #111111; stroke: #000000; stroke-width: 0.1; }
      .note-sustain { fill: #111111; rx: 0.8; ry: 0.8; }
      .note-accent { fill: #111111; }
    </style>
  </defs>

  <!-- Fondo de la tira completa: 1000 mm x 60 mm con margen de corte de 5 mm -->
  <rect x="5" y="5" width="1000" height="60" class="bg" />

  <!-- Línea divisoria central en Y = 35 (30 mm arriba: Melodía, 30 mm abajo: Ritmo) -->
  <line x1="5" y1="35" x2="1005" y2="35" class="band-divider" />

  <!-- Generamos los 10 bloques de 96 mm con 4 mm de separación (Total bloque = 100 mm) -->
  
  <!-- ==================== BLOQUE 1: TEMPLATE 01 - BASIC BEAT & BASS ==================== -->
  <g transform="translate(8, 7)">
    <!-- Marcadores de Registro en 4 esquinas (diámetro 3 mm) -->
    <rect x="0" y="0" width="3" height="3" class="marker" />
    <rect x="93" y="0" width="3" height="3" class="marker" />
    <rect x="0" y="53" width="3" height="3" class="marker" />
    <rect x="93" y="53" width="3" height="3" class="marker" />

    <!-- Borde del Bloque -->
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />

    <!-- Rótulo del Bloque -->
    <text x="5" y="-1.5" class="title">B1: TEMPLATE 01 — 4-ON-THE-FLOOR</text>
    <text x="5" y="2.5" class="label">▲ MELODÍA (30mm)</text>
    <text x="5" y="30.5" class="label">▼ RITMO (30mm)</text>

    <!-- Grilla 16 columnas x 8 filas (celdas de 6mm x 7mm) -->
    <!-- Columnas 0..15 -->
    <!-- Pasos rítmicos: Kick en 0, 4, 8, 12 (fila 7) -->
    <rect x="2" y="50" width="4" height="4" class="note-on" />
    <rect x="26" y="50" width="4" height="4" class="note-on" />
    <rect x="50" y="50" width="4" height="4" class="note-on" />
    <rect x="74" y="50" width="4" height="4" class="note-on" />

    <!-- Snare en 4, 12 (fila 6) -->
    <circle cx="28" cy="45.5" r="2" class="note-on" />
    <circle cx="76" cy="45.5" r="2" class="note-on" />

    <!-- Closed Hat en 2, 6, 10, 14 (fila 5) -->
    <circle cx="16" cy="38.5" r="1.5" class="note-on" />
    <circle cx="40" cy="38.5" r="1.5" class="note-on" />
    <circle cx="64" cy="38.5" r="1.5" class="note-on" />
    <circle cx="88" cy="38.5" r="1.5" class="note-on" />

    <!-- Bajo Melódico con Sustain: Líneas horizontales en fila 3 -->
    <rect x="2" y="22" width="10" height="3" class="note-sustain" />
    <rect x="26" y="22" width="10" height="3" class="note-sustain" />
    <rect x="50" y="15" width="10" height="3" class="note-sustain" />
    <rect x="74" y="22" width="10" height="3" class="note-sustain" />
  </g>

  <!-- ==================== BLOQUE 2: TEMPLATE 02 - SYNCOPATED GROOVE ==================== -->
  <g transform="translate(108, 7)">
    <rect x="0" y="0" width="3" height="3" class="marker" />
    <rect x="93" y="0" width="3" height="3" class="marker" />
    <rect x="0" y="53" width="3" height="3" class="marker" />
    <rect x="93" y="53" width="3" height="3" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="5" y="-1.5" class="title">B2: TEMPLATE 02 — SÍNCOPA & ARP</text>
    <!-- Kick syncopated: 0, 3, 8, 11 -->
    <rect x="2" y="50" width="4" height="4" class="note-on" />
    <rect x="20" y="50" width="4" height="4" class="note-on" />
    <rect x="50" y="50" width="4" height="4" class="note-on" />
    <rect x="68" y="50" width="4" height="4" class="note-on" />
    <!-- Snare: 4, 12 -->
    <circle cx="28" cy="45.5" r="2" class="note-on" />
    <circle cx="76" cy="45.5" r="2" class="note-on" />
    <!-- Arpegio melódico ascendente escalonado -->
    <circle cx="4" cy="23.5" r="1.8" class="note-on" />
    <circle cx="10" cy="16.5" r="1.8" class="note-on" />
    <circle cx="16" cy="9.5" r="1.8" class="note-on" />
    <circle cx="22" cy="2.5" r="1.8" class="note-on" />
    <circle cx="28" cy="9.5" r="1.8" class="note-on" />
    <circle cx="34" cy="16.5" r="1.8" class="note-on" />
    <circle cx="40" cy="23.5" r="1.8" class="note-on" />
    <circle cx="46" cy="16.5" r="1.8" class="note-on" />
  </g>

  <!-- ==================== BLOQUE 3: TEMPLATE 03 - AMBIENT SUSTAIN ==================== -->
  <g transform="translate(208, 7)">
    <rect x="0" y="0" width="3" height="3" class="marker" />
    <rect x="93" y="0" width="3" height="3" class="marker" />
    <rect x="0" y="53" width="3" height="3" class="marker" />
    <rect x="93" y="53" width="3" height="3" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="5" y="-1.5" class="title">B3: TEMPLATE 03 — AMBIENT PADS</text>
    <!-- Melodía con largas notas ligadas (Sustain continuo) -->
    <rect x="2" y="8" width="44" height="3.5" class="note-sustain" />
    <rect x="50" y="15" width="44" height="3.5" class="note-sustain" />
    <!-- Percusión mínima y micro-clicks -->
    <circle cx="4" cy="38.5" r="1.2" class="note-on" />
    <circle cx="28" cy="38.5" r="1.2" class="note-on" />
    <circle cx="52" cy="38.5" r="1.2" class="note-on" />
    <circle cx="76" cy="38.5" r="1.2" class="note-on" />
  </g>

  <!-- ==================== BLOQUE 4: TEMPLATE 04 - ELECTRO ACID ==================== -->
  <g transform="translate(308, 7)">
    <rect x="0" y="0" width="3" height="3" class="marker" />
    <rect x="93" y="0" width="3" height="3" class="marker" />
    <rect x="0" y="53" width="3" height="3" class="marker" />
    <rect x="93" y="53" width="3" height="3" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="5" y="-1.5" class="title">B4: TEMPLATE 04 — ELECTRO ACID & ACCENTS</text>
    <!-- Kick continuo -->
    <rect x="2" y="50" width="4" height="4" class="note-on" />
    <rect x="26" y="50" width="4" height="4" class="note-on" />
    <rect x="50" y="50" width="4" height="4" class="note-on" />
    <rect x="74" y="50" width="4" height="4" class="note-on" />
    <!-- Líneas verticales de ACENTO en bajo -->
    <line x1="16" y1="18" x2="16" y2="26" stroke="#000" stroke-width="2.5" />
    <line x1="40" y1="18" x2="40" y2="26" stroke="#000" stroke-width="2.5" />
    <line x1="64" y1="11" x2="64" y2="19" stroke="#000" stroke-width="2.5" />
    <line x1="88" y1="4" x2="88" y2="12" stroke="#000" stroke-width="2.5" />
  </g>

  <!-- ==================== BLOQUE 5: TEMPLATE 05 - POLIRRITMIA ==================== -->
  <g transform="translate(408, 7)">
    <rect x="0" y="0" width="3" height="3" class="marker" />
    <rect x="93" y="0" width="3" height="3" class="marker" />
    <rect x="0" y="53" width="3" height="3" class="marker" />
    <rect x="93" y="53" width="3" height="3" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="5" y="-1.5" class="title">B5: TEMPLATE 05 — POLIRRITMO 3 CONTRA 4</text>
    <!-- Tresillos rítmicos en percusión -->
    <circle cx="4" cy="52" r="1.8" class="note-on" />
    <circle cx="20" cy="52" r="1.8" class="note-on" />
    <circle cx="36" cy="52" r="1.8" class="note-on" />
    <circle cx="52" cy="52" r="1.8" class="note-on" />
    <circle cx="68" cy="52" r="1.8" class="note-on" />
    <circle cx="84" cy="52" r="1.8" class="note-on" />
    <!-- Melodía pentatónica en contrapunto -->
    <rect x="2" y="22" width="8" height="3" class="note-sustain" />
    <rect x="32" y="15" width="8" height="3" class="note-sustain" />
    <rect x="62" y="8" width="8" height="3" class="note-sustain" />
  </g>

  <!-- ==================== BLOQUES 6 A 10: CAJONES LIBRES PARA DIBUJAR ==================== -->
  <!-- B6: Espacio Libre 1 -->
  <g transform="translate(508, 7)">
    <rect x="0" y="0" width="3" height="3" class="marker" />
    <rect x="93" y="0" width="3" height="3" class="marker" />
    <rect x="0" y="53" width="3" height="3" class="marker" />
    <rect x="93" y="53" width="3" height="3" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="5" y="-1.5" class="title">B6: ESPACIO LIBRE 01 [DIBUJA AQUÍ]</text>
    <!-- Guía punteada sutil para celdas -->
    <!-- 16 columnas x 8 filas (puntos guía suaves) -->
    <g fill="#cccccc">
      <circle cx="4" cy="4" r="0.4" /><circle cx="10" cy="4" r="0.4" /><circle cx="16" cy="4" r="0.4" /><circle cx="22" cy="4" r="0.4" />
      <circle cx="28" cy="4" r="0.4" /><circle cx="34" cy="4" r="0.4" /><circle cx="40" cy="4" r="0.4" /><circle cx="46" cy="4" r="0.4" />
      <circle cx="52" cy="4" r="0.4" /><circle cx="58" cy="4" r="0.4" /><circle cx="64" cy="4" r="0.4" /><circle cx="70" cy="4" r="0.4" />
      <circle cx="76" cy="4" r="0.4" /><circle cx="82" cy="4" r="0.4" /><circle cx="88" cy="4" r="0.4" /><circle cx="94" cy="4" r="0.4" />
      
      <circle cx="4" cy="32" r="0.4" /><circle cx="10" cy="32" r="0.4" /><circle cx="16" cy="32" r="0.4" /><circle cx="22" cy="32" r="0.4" />
      <circle cx="28" cy="32" r="0.4" /><circle cx="34" cy="32" r="0.4" /><circle cx="40" cy="32" r="0.4" /><circle cx="46" cy="32" r="0.4" />
      <circle cx="52" cy="32" r="0.4" /><circle cx="58" cy="32" r="0.4" /><circle cx="64" cy="32" r="0.4" /><circle cx="70" cy="32" r="0.4" />
      <circle cx="76" cy="32" r="0.4" /><circle cx="82" cy="32" r="0.4" /><circle cx="88" cy="32" r="0.4" /><circle cx="94" cy="32" r="0.4" />
    </g>
  </g>

  <!-- B7: Espacio Libre 2 -->
  <g transform="translate(608, 7)">
    <rect x="0" y="0" width="3" height="3" class="marker" />
    <rect x="93" y="0" width="3" height="3" class="marker" />
    <rect x="0" y="53" width="3" height="3" class="marker" />
    <rect x="93" y="53" width="3" height="3" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="5" y="-1.5" class="title">B7: ESPACIO LIBRE 02 [DIBUJA AQUÍ]</text>
  </g>

  <!-- B8: Espacio Libre 3 -->
  <g transform="translate(708, 7)">
    <rect x="0" y="0" width="3" height="3" class="marker" />
    <rect x="93" y="0" width="3" height="3" class="marker" />
    <rect x="0" y="53" width="3" height="3" class="marker" />
    <rect x="93" y="53" width="3" height="3" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="5" y="-1.5" class="title">B8: ESPACIO LIBRE 03 [DIBUJA AQUÍ]</text>
  </g>

  <!-- B9: Espacio Libre 4 -->
  <g transform="translate(808, 7)">
    <rect x="0" y="0" width="3" height="3" class="marker" />
    <rect x="93" y="0" width="3" height="3" class="marker" />
    <rect x="0" y="53" width="3" height="3" class="marker" />
    <rect x="93" y="53" width="3" height="3" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="5" y="-1.5" class="title">B9: ESPACIO LIBRE 04 [DIBUJA AQUÍ]</text>
  </g>

  <!-- B10: Espacio Libre 5 -->
  <g transform="translate(908, 7)">
    <rect x="0" y="0" width="3" height="3" class="marker" />
    <rect x="93" y="0" width="3" height="3" class="marker" />
    <rect x="0" y="53" width="3" height="3" class="marker" />
    <rect x="93" y="53" width="3" height="3" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="5" y="-1.5" class="title">B10: ESPACIO LIBRE 05 [DIBUJA AQUÍ]</text>
  </g>

</svg>
