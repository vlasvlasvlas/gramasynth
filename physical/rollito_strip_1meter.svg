<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 70" width="1020mm" height="70mm">
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #000000; stroke-width: 0.5; }
      .marker { fill: #000000; }
      .block-border { fill: none; stroke: #000000; stroke-width: 0.8; }
      .band-divider { stroke: #000000; stroke-width: 0.6; stroke-dasharray: 1.5,1.5; }
      .lane-line { stroke: #e2e8f0; stroke-width: 0.35; }
      .beat-line { stroke: #cbd5e1; stroke-width: 0.3; stroke-dasharray: 0.8,1.2; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 2px; fill: #64748b; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 2.8px; font-weight: bold; fill: #0f172a; }
      .note-on { fill: #000000; }
    </style>
  </defs>

  <!-- Fondo de la tira continua: 1000 mm x 60 mm con margen de corte -->
  <rect x="5" y="5" width="1000" height="60" class="bg" />

  <!-- Línea divisoria central en Y = 35 (30 mm Melodía, 30 mm Ritmo) -->
  <line x1="5" y1="35" x2="1005" y2="35" class="band-divider" />

  <!-- ==================== BLOQUE 1: EL HORIZONTE Y EL PULSO ==================== -->
  <g transform="translate(8, 7)">
    <rect x="0" y="0" width="4" height="4" class="marker" />
    <rect x="92" y="0" width="4" height="4" class="marker" />
    <rect x="0" y="52" width="4" height="4" class="marker" />
    <rect x="92" y="52" width="4" height="4" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="6" y="-1.5" class="title">B1: EL HORIZONTE & EL PULSO (SUSTAIN)</text>
    
    <!-- Línea horizontal continua sostenida de Sol -->
    <rect x="8" y="19" width="80" height="3" rx="1.5" class="note-on" />
    <circle cx="28" cy="11" r="1.8" class="note-on" />
    <circle cx="68" cy="11" r="1.8" class="note-on" />

    <!-- 4 Bombos en negra + Cajas + Hats -->
    <rect x="8" y="49" width="6" height="5" rx="1" class="note-on" />
    <rect x="28" y="49" width="6" height="5" rx="1" class="note-on" />
    <rect x="48" y="49" width="6" height="5" rx="1" class="note-on" />
    <rect x="68" y="49" width="6" height="5" rx="1" class="note-on" />
    <circle cx="28" cy="42" r="2.2" class="note-on" />
    <circle cx="68" cy="42" r="2.2" class="note-on" />
    <circle cx="18" cy="35" r="1.4" class="note-on" /><circle cx="38" cy="35" r="1.4" class="note-on" />
    <circle cx="58" cy="35" r="1.4" class="note-on" /><circle cx="78" cy="35" r="1.4" class="note-on" />
  </g>

  <!-- ==================== BLOQUE 2: LA MONTAÑA RUSA ==================== -->
  <g transform="translate(108, 7)">
    <rect x="0" y="0" width="4" height="4" class="marker" />
    <rect x="92" y="0" width="4" height="4" class="marker" />
    <rect x="0" y="52" width="4" height="4" class="marker" />
    <rect x="92" y="52" width="4" height="4" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="6" y="-1.5" class="title">B2: LA MONTAÑA RUSA (ARPEGIO / ONDA)</text>
    
    <!-- Curva continua que sube y baja -->
    <path d="M 8 24 Q 18 8, 28 24 T 48 24 T 68 24 T 84 10" fill="none" stroke="#000" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="18" cy="11" r="2.2" class="note-on" /><circle cx="38" cy="11" r="2.2" class="note-on" />
    <circle cx="58" cy="11" r="2.2" class="note-on" /><circle cx="84" cy="10" r="2.5" class="note-on" />

    <!-- Ritmo quebrado -->
    <rect x="8" y="49" width="5.5" height="4.5" rx="1" class="note-on" />
    <rect x="23" y="49" width="5.5" height="4.5" rx="1" class="note-on" />
    <rect x="48" y="49" width="5.5" height="4.5" rx="1" class="note-on" />
    <rect x="63" y="49" width="5.5" height="4.5" rx="1" class="note-on" />
    <circle cx="38" cy="42" r="2.2" class="note-on" /><circle cx="78" cy="42" r="2.2" class="note-on" />
  </g>

  <!-- ==================== BLOQUE 3: LA LLUVIA DE GOTAS ==================== -->
  <g transform="translate(208, 7)">
    <rect x="0" y="0" width="4" height="4" class="marker" />
    <rect x="92" y="0" width="4" height="4" class="marker" />
    <rect x="0" y="52" width="4" height="4" class="marker" />
    <rect x="92" y="52" width="4" height="4" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="6" y="-1.5" class="title">B3: LA LLUVIA DE GOTAS (STACCATO)</text>
    
    <!-- Nube de gotas melódicas -->
    <circle cx="10" cy="12" r="1.8" class="note-on" /><circle cx="18" cy="22" r="1.8" class="note-on" />
    <circle cx="26" cy="16" r="1.8" class="note-on" /><circle cx="34" cy="9" r="2.2" class="note-on" />
    <circle cx="42" cy="21" r="1.8" class="note-on" /><circle cx="50" cy="14" r="1.8" class="note-on" />
    <circle cx="58" cy="24" r="1.8" class="note-on" /><circle cx="66" cy="11" r="2.2" class="note-on" />
    <circle cx="74" cy="18" r="1.8" class="note-on" /><circle cx="82" cy="13" r="1.8" class="note-on" />

    <!-- Gotas percusivas -->
    <circle cx="10" cy="51" r="2.6" class="note-on" /><circle cx="28" cy="36" r="1.6" class="note-on" />
    <circle cx="34" cy="43" r="2.0" class="note-on" /><circle cx="50" cy="51" r="2.6" class="note-on" />
    <circle cx="66" cy="36" r="1.6" class="note-on" /><circle cx="72" cy="43" r="2.0" class="note-on" />
  </g>

  <!-- ==================== BLOQUE 4: EL TOBOGÁN ACID ==================== -->
  <g transform="translate(308, 7)">
    <rect x="0" y="0" width="4" height="4" class="marker" />
    <rect x="92" y="0" width="4" height="4" class="marker" />
    <rect x="0" y="52" width="4" height="4" class="marker" />
    <rect x="92" y="52" width="4" height="4" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="6" y="-1.5" class="title">B4: EL TOBOGÁN ACID & ACENTOS</text>
    
    <!-- Rampas diagonales + Acentos verticales -->
    <line x1="10" y1="11" x2="32" y2="25" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    <rect x="38" y="10" width="2.6" height="15" rx="0.6" class="note-on" />
    <line x1="48" y1="25" x2="70" y2="11" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    <rect x="76" y="10" width="2.6" height="15" rx="0.6" class="note-on" />

    <rect x="10" y="49" width="6" height="4.5" rx="0.8" class="note-on" />
    <rect x="30" y="49" width="6" height="4.5" rx="0.8" class="note-on" />
    <rect x="50" y="49" width="6" height="4.5" rx="0.8" class="note-on" />
    <rect x="70" y="49" width="6" height="4.5" rx="0.8" class="note-on" />
  </g>

  <!-- ==================== BLOQUE 5: LA TORMENTA ==================== -->
  <g transform="translate(408, 7)">
    <rect x="0" y="0" width="4" height="4" class="marker" />
    <rect x="92" y="0" width="4" height="4" class="marker" />
    <rect x="0" y="52" width="4" height="4" class="marker" />
    <rect x="92" y="52" width="4" height="4" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="6" y="-1.5" class="title">B5: LA TORMENTA (MANCHAS & NOISE)</text>
    
    <!-- Bloques gruesos saturados -->
    <rect x="8" y="13" width="24" height="5" rx="1.2" class="note-on" />
    <rect x="38" y="20" width="24" height="5" rx="1.2" class="note-on" />
    <rect x="68" y="10" width="18" height="7" rx="1.2" class="note-on" />

    <rect x="8" y="48" width="8" height="6" rx="1" class="note-on" />
    <rect x="22" y="48" width="8" height="6" rx="1" class="note-on" />
    <rect x="36" y="48" width="8" height="6" rx="1" class="note-on" />
    <rect x="50" y="48" width="8" height="6" rx="1" class="note-on" />
    <rect x="64" y="48" width="22" height="6" rx="1" class="note-on" />
  </g>

  <!-- ==================== BLOQUES 6 A 10: LIENZOS LIBRES PARA DIBUJAR ==================== -->
  <!-- B6: Lienzo Libre 1 -->
  <g transform="translate(508, 7)">
    <rect x="0" y="0" width="4" height="4" class="marker" />
    <rect x="92" y="0" width="4" height="4" class="marker" />
    <rect x="0" y="52" width="4" height="4" class="marker" />
    <rect x="92" y="52" width="4" height="4" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="6" y="-1.5" class="title">B6: TU DIBUJO LIBRE 01 ✍️</text>
    <!-- Carriles de pentagrama suave -->
    <line x1="6" y1="10" x2="90" y2="10" class="lane-line" /><line x1="6" y1="15" x2="90" y2="15" class="lane-line" />
    <line x1="6" y1="20" x2="90" y2="20" class="lane-line" /><line x1="6" y1="25" x2="90" y2="25" class="lane-line" />
    <line x1="6" y1="36" x2="90" y2="36" class="lane-line" /><line x1="6" y1="43" x2="90" y2="43" class="lane-line" />
    <line x1="6" y1="51" x2="90" y2="51" class="lane-line" />
    <line x1="28" y1="6" x2="28" y2="54" class="beat-line" /><line x1="50" y1="6" x2="50" y2="54" class="beat-line" />
    <line x1="72" y1="6" x2="72" y2="54" class="beat-line" />
  </g>

  <!-- B7: Lienzo Libre 2 -->
  <g transform="translate(608, 7)">
    <rect x="0" y="0" width="4" height="4" class="marker" />
    <rect x="92" y="0" width="4" height="4" class="marker" />
    <rect x="0" y="52" width="4" height="4" class="marker" />
    <rect x="92" y="52" width="4" height="4" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="6" y="-1.5" class="title">B7: TU DIBUJO LIBRE 02 ✍️</text>
    <line x1="6" y1="10" x2="90" y2="10" class="lane-line" /><line x1="6" y1="15" x2="90" y2="15" class="lane-line" />
    <line x1="6" y1="20" x2="90" y2="20" class="lane-line" /><line x1="6" y1="25" x2="90" y2="25" class="lane-line" />
    <line x1="6" y1="36" x2="90" y2="36" class="lane-line" /><line x1="6" y1="43" x2="90" y2="43" class="lane-line" /><line x1="6" y1="51" x2="90" y2="51" class="lane-line" />
    <line x1="28" y1="6" x2="28" y2="54" class="beat-line" /><line x1="50" y1="6" x2="50" y2="54" class="beat-line" /><line x1="72" y1="6" x2="72" y2="54" class="beat-line" />
  </g>

  <!-- B8: Lienzo Libre 3 -->
  <g transform="translate(708, 7)">
    <rect x="0" y="0" width="4" height="4" class="marker" />
    <rect x="92" y="0" width="4" height="4" class="marker" />
    <rect x="0" y="52" width="4" height="4" class="marker" />
    <rect x="92" y="52" width="4" height="4" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="6" y="-1.5" class="title">B8: TU DIBUJO LIBRE 03 ✍️</text>
    <line x1="6" y1="10" x2="90" y2="10" class="lane-line" /><line x1="6" y1="15" x2="90" y2="15" class="lane-line" />
    <line x1="6" y1="20" x2="90" y2="20" class="lane-line" /><line x1="6" y1="25" x2="90" y2="25" class="lane-line" />
    <line x1="6" y1="36" x2="90" y2="36" class="lane-line" /><line x1="6" y1="43" x2="90" y2="43" class="lane-line" /><line x1="6" y1="51" x2="90" y2="51" class="lane-line" />
    <line x1="28" y1="6" x2="28" y2="54" class="beat-line" /><line x1="50" y1="6" x2="50" y2="54" class="beat-line" /><line x1="72" y1="6" x2="72" y2="54" class="beat-line" />
  </g>

  <!-- B9: Lienzo Libre 4 -->
  <g transform="translate(808, 7)">
    <rect x="0" y="0" width="4" height="4" class="marker" />
    <rect x="92" y="0" width="4" height="4" class="marker" />
    <rect x="0" y="52" width="4" height="4" class="marker" />
    <rect x="92" y="52" width="4" height="4" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="6" y="-1.5" class="title">B9: TU DIBUJO LIBRE 04 ✍️</text>
    <line x1="6" y1="10" x2="90" y2="10" class="lane-line" /><line x1="6" y1="15" x2="90" y2="15" class="lane-line" />
    <line x1="6" y1="20" x2="90" y2="20" class="lane-line" /><line x1="6" y1="25" x2="90" y2="25" class="lane-line" />
    <line x1="6" y1="36" x2="90" y2="36" class="lane-line" /><line x1="6" y1="43" x2="90" y2="43" class="lane-line" /><line x1="6" y1="51" x2="90" y2="51" class="lane-line" />
    <line x1="28" y1="6" x2="28" y2="54" class="beat-line" /><line x1="50" y1="6" x2="50" y2="54" class="beat-line" /><line x1="72" y1="6" x2="72" y2="54" class="beat-line" />
  </g>

  <!-- B10: Lienzo Libre 5 -->
  <g transform="translate(908, 7)">
    <rect x="0" y="0" width="4" height="4" class="marker" />
    <rect x="92" y="0" width="4" height="4" class="marker" />
    <rect x="0" y="52" width="4" height="4" class="marker" />
    <rect x="92" y="52" width="4" height="4" class="marker" />
    <rect x="0" y="0" width="96" height="56" class="block-border" />
    <line x1="0" y1="28" x2="96" y2="28" class="band-divider" />
    <text x="6" y="-1.5" class="title">B10: TU DIBUJO LIBRE 05 ✍️</text>
    <line x1="6" y1="10" x2="90" y2="10" class="lane-line" /><line x1="6" y1="15" x2="90" y2="15" class="lane-line" />
    <line x1="6" y1="20" x2="90" y2="20" class="lane-line" /><line x1="6" y1="25" x2="90" y2="25" class="lane-line" />
    <line x1="6" y1="36" x2="90" y2="36" class="lane-line" /><line x1="6" y1="43" x2="90" y2="43" class="lane-line" /><line x1="6" y1="51" x2="90" y2="51" class="lane-line" />
    <line x1="28" y1="6" x2="28" y2="54" class="beat-line" /><line x1="50" y1="6" x2="50" y2="54" class="beat-line" /><line x1="72" y1="6" x2="72" y2="54" class="beat-line" />
  </g>

</svg>
