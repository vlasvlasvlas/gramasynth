<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROLLITO — Gramasynth</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="brand">
      <h1>ROLLITO</h1>
      <span id="statusBadge" class="status-badge status-idle">IDLE</span>
    </div>
    <div class="top-actions">
      <span id="confidenceMeter" class="confidence-text">—</span>
      <button id="btnCapture" class="btn btn-accept">📸 Capturar</button>
      <button id="btnPlay" class="btn btn-primary">▶ Iniciar</button>
    </div>
  </header>

  <main>

    <!-- COLUMNA IZQUIERDA: CÁMARA + controles de lectura -->
    <div class="panel panel-left" id="panelCamera">
      <div class="panel-header">
        <h2>Cámara</h2>
        <div class="control-group">
          <select id="cameraSelect"><option value="">Predeterminada</option></select>
          <button id="btnCamera" class="btn btn-primary">Activar</button>
          <button id="btnMirror" class="btn" title="Espejo">⇄</button>
          <button id="btnFlipV" class="btn" title="Voltear">⇅</button>
        </div>
      </div>

      <!-- Viewport: video + pines + binary overlay como inset -->
      <div class="camera-viewport">
        <video id="webcam" playsinline autoplay muted></video>
        <canvas id="pinCanvas" class="corner-pin-canvas"></canvas>
        <!-- Binary inset: esquina inferior-derecha, muestra el procesado en tiempo real -->
        <canvas id="processedCanvas" class="binary-inset" width="480" height="240"></canvas>
        <span class="inset-label">BINARIO</span>
      </div>

      <!-- Canvas de trabajo oculto (para homografía y lectura) -->
      <canvas id="rectifiedCanvas" class="offscreen-canvas" width="480" height="240"></canvas>

      <div class="controls-bar">
        <button id="btnAutoCorner" class="btn btn-primary">✨ Auto-Esq.</button>
        <button id="btnResetPins" class="btn">↺ Centrar</button>
        <label class="toggle-label">
          <input type="checkbox" id="autoTrackCheck"> Seguir
        </label>
        <span id="cornerDetectStatus" class="status-text">Pines ajustables</span>
      </div>

      <div class="controls-bar controls-bar-sliders">
        <div class="control-group">
          <label>Brillo</label>
          <input type="range" id="brightnessSlider" min="50" max="200" value="100">
          <span id="brightnessVal">100%</span>
        </div>
        <div class="control-group">
          <label>Contraste</label>
          <input type="range" id="contrastSlider" min="50" max="250" value="140">
          <span id="contrastVal">140%</span>
        </div>
        <div class="control-group">
          <label>Umbral</label>
          <input type="range" id="thresholdSlider" min="30" max="220" value="125">
          <span id="thresholdVal">125</span>
        </div>
        <button id="btnAutoThreshold" class="btn">Auto</button>
      </div>
    </div>

    <!-- COLUMNA DERECHA: SECUENCIADOR (ocupa toda la altura) -->
    <div class="panel panel-right sequencer-panel">
      <div class="panel-header">
        <h2>Secuenciador</h2>
        <div class="control-group">
          <button id="btnAccept" class="btn btn-accept" disabled>✓ <span class="badge-key">ESPACIO</span></button>
          <button id="btnDiscard" class="btn btn-action" disabled>✕ <span class="badge-key">ESC</span></button>
          <select id="kitSelect" title="Kit de batería">
            <option value="electronic">Kit: Electrónico</option>
            <option value="acoustic">Kit: Acústico</option>
            <option value="lofi">Kit: Lo-Fi</option>
            <option value="8bit">Kit: 8bit</option>
          </select>
          <select id="templateSelect">
            <option value="template_01">4-on-the-floor</option>
            <option value="template_02">Síncopa</option>
            <option value="template_03">Ambient</option>
            <option value="template_04">Acid</option>
            <option value="template_05">3/4</option>
          </select>
          <button id="btnLoadTemplate" class="btn">Cargar</button>
        </div>
      </div>

      <canvas id="sequencerCanvas" class="sequencer-canvas" width="960" height="320"></canvas>

      <div class="controls-bar">
        <div class="control-group">
          <label>BPM</label>
          <input type="range" id="bpmSlider" min="50" max="180" value="110">
          <span id="bpmVal">110</span>
        </div>
        <div class="control-group">
          <label>Tono</label>
          <select id="rootNoteSelect">
            <option value="0">C</option>
            <option value="1">C#</option>
            <option value="2">D</option>
            <option value="3">D#</option>
            <option value="4">E</option>
            <option value="5">F</option>
            <option value="6">F#</option>
            <option value="7">G</option>
            <option value="8">G#</option>
            <option value="9">A</option>
            <option value="10">A#</option>
            <option value="11">B</option>
          </select>
        </div>
        <div class="legend">
          <span><strong style="color:#00f0ff;">■</strong> Activo</span>
          <span><strong style="color:#ec4899;">□</strong> Próximo</span>
          <span><strong style="color:#f59e0b;">◌</strong> Preview</span>
        </div>
      </div>
    </div>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
