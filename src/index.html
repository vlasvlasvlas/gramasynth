<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROLLITO — Gramasynth</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="brand">
      <h1>ROLLITO</h1>
      <span id="statusBadge" class="status-badge status-idle">IDLE</span>
    </div>
    <div class="top-actions">
      <button id="btnPlay" class="btn btn-primary">▶ Iniciar</button>
      <a href="../physical/print.html" target="_blank" class="btn" style="text-decoration:none;">🖨️ Imprimir</a>
    </div>
  </header>

  <main>

    <!-- PANEL: CÁMARA -->
    <div class="panel" id="panelCamera">
      <div class="panel-header">
        <h2>Cámara</h2>
        <div class="control-group">
          <select id="cameraSelect">
            <option value="">Predeterminada</option>
          </select>
          <button id="btnCamera" class="btn btn-primary">Activar</button>
          <button id="btnMirror" class="btn" title="Espejo horizontal">⇄</button>
          <button id="btnFlipV" class="btn" title="Invertir vertical">⇅</button>
        </div>
      </div>

      <div class="camera-viewport">
        <video id="webcam" playsinline autoplay muted></video>
        <canvas id="pinCanvas" class="corner-pin-canvas"></canvas>
      </div>

      <div class="controls-bar">
        <button id="btnAutoCorner" class="btn btn-primary">✨ Auto-Esquinas</button>
        <button id="btnResetPins" class="btn">↺ Centrar</button>
        <label class="toggle-label">
          <input type="checkbox" id="autoTrackCheck">
          Auto-seguir
        </label>
        <span id="cornerDetectStatus" class="status-text">Pines ajustables</span>
      </div>
    </div>

    <!-- PANEL: VISIÓN + CAPTURA -->
    <div class="panel" id="panelVision">
      <div class="panel-header">
        <h2>Lectura</h2>
        <div class="control-group">
          <span id="confidenceMeter" class="confidence-text">—</span>
          <button id="btnCapture" class="btn btn-primary">📸 Capturar</button>
        </div>
      </div>

      <div class="vision-dual-display">
        <div class="vision-box">
          <span class="vision-box-tag">Color</span>
          <canvas id="rectifiedCanvas" class="rectified-canvas" width="480" height="240"></canvas>
        </div>
        <div class="vision-box">
          <span class="vision-box-tag">Binario (notas)</span>
          <canvas id="processedCanvas" class="rectified-canvas" width="480" height="240"></canvas>
        </div>
      </div>

      <div class="controls-bar">
        <div class="control-group">
          <label>Brillo</label>
          <input type="range" id="brightnessSlider" min="50" max="200" value="100">
          <span id="brightnessVal">100%</span>
        </div>
        <div class="control-group">
          <label>Contraste</label>
          <input type="range" id="contrastSlider" min="50" max="250" value="140">
          <span id="contrastVal">140%</span>
        </div>
        <div class="control-group">
          <label>Umbral</label>
          <input type="range" id="thresholdSlider" min="30" max="220" value="125">
          <span id="thresholdVal">125</span>
        </div>
        <button id="btnAutoThreshold" class="btn">Auto-Umbral</button>
      </div>
    </div>

    <!-- PANEL: SECUENCIADOR -->
    <div class="panel sequencer-panel">
      <div class="panel-header">
        <h2>Secuenciador</h2>
        <div class="control-group">
          <button id="btnAccept" class="btn btn-accept" disabled>✓ Aceptar <span class="badge-key">ESPACIO</span></button>
          <button id="btnDiscard" class="btn btn-action" disabled>✕ Descartar <span class="badge-key">ESC</span></button>
          <div class="control-group" style="margin-left: 16px;">
            <label>Plantilla:</label>
            <select id="templateSelect">
              <option value="template_01">4-on-the-floor</option>
              <option value="template_02">Síncopa</option>
              <option value="template_03">Ambient</option>
              <option value="template_04">Acid</option>
              <option value="template_05">3/4</option>
            </select>
            <button id="btnLoadTemplate" class="btn">Cargar</button>
          </div>
        </div>
      </div>

      <canvas id="sequencerCanvas" class="sequencer-canvas" width="960" height="280"></canvas>

      <div class="controls-bar">
        <div class="control-group">
          <label>BPM:</label>
          <input type="range" id="bpmSlider" min="50" max="180" value="110">
          <span id="bpmVal">110</span>
        </div>
        <div class="legend">
          <span><strong style="color:#00f0ff;">■</strong> Activo</span>
          <span><strong style="color:#ec4899;">□</strong> Próximo</span>
          <span><strong style="color:#f59e0b;">◌</strong> Preview</span>
        </div>
      </div>
    </div>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
